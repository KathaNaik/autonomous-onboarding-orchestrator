name: aoo

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aoo}
      POSTGRES_DB: ${POSTGRES_DB:-aoo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aoo}:${POSTGRES_PASSWORD:-aoo}@postgres:5432/${POSTGRES_DB:-aoo}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-aoo}:${POSTGRES_PASSWORD:-aoo}@postgres:5432/${POSTGRES_DB:-aoo}
      # Development-only default. Set HRIS_WEBHOOK_SECRET (>= 32 chars) for anything real.
      HRIS_WEBHOOK_SECRET: ${HRIS_WEBHOOK_SECRET:-dev-only-hris-webhook-secret-change-me}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    environment:
      PORT: 3000
      API_BASE_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
