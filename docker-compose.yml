name: aoo

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aoo}
      POSTGRES_DB: ${POSTGRES_DB:-aoo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aoo}:${POSTGRES_PASSWORD:-aoo}@postgres:5432/${POSTGRES_DB:-aoo}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-aoo}:${POSTGRES_PASSWORD:-aoo}@postgres:5432/${POSTGRES_DB:-aoo}
      # Development-only default. Set HRIS_WEBHOOK_SECRET (>= 32 chars) for anything real.
      HRIS_WEBHOOK_SECRET: ${HRIS_WEBHOOK_SECRET:-dev-only-hris-webhook-secret-change-me}
      # Development-only default. HR/onboarding operator bearer token (admin routes).
      ONBOARDING_ADMIN_TOKEN: ${ONBOARDING_ADMIN_TOKEN:-dev-only-onboarding-admin-token-change-me}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aoo}:${POSTGRES_PASSWORD:-aoo}@postgres:5432/${POSTGRES_DB:-aoo}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_LEASE_MS: ${OUTBOX_LEASE_MS:-30000}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
      OUTBOX_BACKOFF_BASE_MS: ${OUTBOX_BACKOFF_BASE_MS:-1000}
      OUTBOX_BACKOFF_MAX_MS: ${OUTBOX_BACKOFF_MAX_MS:-300000}
      # ServiceNow (optional; integration account only, never the schema-verifier account).
      # 3 × SERVICENOW_TIMEOUT_MS must be ≤ 0.8 × OUTBOX_LEASE_MS (checked at startup).
      SERVICENOW_INSTANCE_URL: ${SERVICENOW_INSTANCE_URL:-}
      SERVICENOW_USERNAME: ${SERVICENOW_USERNAME:-}
      SERVICENOW_PASSWORD: ${SERVICENOW_PASSWORD:-}
      SERVICENOW_ACCESS_REQUEST_TABLE: ${SERVICENOW_ACCESS_REQUEST_TABLE:-}
      SERVICENOW_TIMEOUT_MS: ${WORKER_SERVICENOW_TIMEOUT_MS:-5000}
    # No published port: health is internal (Docker HEALTHCHECK on /ready), so
    # `docker compose up --scale worker=3` works. WORKER_ID defaults to <hostname>-<pid>.
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    environment:
      PORT: 3000
      API_BASE_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
