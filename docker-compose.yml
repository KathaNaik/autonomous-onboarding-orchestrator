name: aoo

services:
  api:
    build:
      context: .
      target: api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: .
      target: web
    environment:
      PORT: 3000
      API_BASE_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
